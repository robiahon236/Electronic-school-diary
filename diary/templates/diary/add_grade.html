{% extends 'diary/base.html' %}
{% block content %}
<h2>{% if edit %}Изменить оценку{% else %}Выставить оценку{% endif %}</h2>
<form method="post" class="col-md-5">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Сохранить</button>
  <a class="btn btn-outline-secondary" href="{% url 'grades' %}">Отмена</a>
</form>
{% endblock %}
